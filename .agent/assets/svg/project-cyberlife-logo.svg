<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Project: Cyberlife — Life-sim Roleplay Server</title>
  <desc id="desc">Original angular cyberpunk-inspired vector logo with a signal-lime and cyan life-line emblem and condensed wordmark.</desc>
  <defs>
    <linearGradient id="pulse" x1="74" y1="142" x2="438" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9F34A"/>
      <stop offset="1" stop-color="#55D9E8"/>
    </linearGradient>
  </defs>

  <!-- Independent, geometric life-signal emblem -->
  <g transform="translate(0 0)">
    <path d="M294 78H421L495 152V421L421 495H153L79 421V152L153 78H216"
      stroke="#D9F34A" stroke-width="12" stroke-linecap="square" stroke-linejoin="bevel"/>
    <path d="M79 190H112M79 224H98M462 348H495M478 382H495" stroke="#55D9E8" stroke-width="7"/>
    <path d="M141 343H204L243 281L287 381L333 205L373 319H435"
      stroke="url(#pulse)" stroke-width="24" stroke-linecap="square" stroke-linejoin="bevel"/>
    <path d="M215 138V204M252 138V174M289 138V204M326 138V174M363 138V204"
      stroke="#F2F6F8" stroke-opacity=".86" stroke-width="13" stroke-linecap="square"/>
    <path d="M174 429H400" stroke="#55D9E8" stroke-opacity=".55" stroke-width="5"/>
    <circle cx="243" cy="281" r="8" fill="#F2F6F8"/>
    <circle cx="333" cy="205" r="8" fill="#F2F6F8"/>
  </g>

  <!-- Wordmark: keep editable as text; substitute Rajdhani/Chakra Petch when installed -->
  <g fill="#F2F6F8" font-family="Rajdhani, 'Chakra Petch', 'Arial Narrow', sans-serif" font-weight="700">
    <text x="565" y="183" font-size="36" letter-spacing="10" fill="#D9F34A">PROJECT:</text>
    <path d="M725 164H855" stroke="#55D9E8" stroke-width="3"/>
    <text x="877" y="183" font-size="36" letter-spacing="5" fill="#55D9E8">LIFE-SIM ROLEPLAY SERVER</text>
    <text x="555" y="370" font-size="174" letter-spacing="2" textLength="945" lengthAdjust="spacingAndGlyphs">CYBERLIFE</text>
  </g>
  <path d="M565 412H1460" stroke="#D9F34A" stroke-width="5"/>
  <path d="M565 412H680" stroke="#55D9E8" stroke-width="5"/>
</svg>
