<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 30, 0.95)"/>
      <stop offset="100%" stop-color="rgba(18, 36, 56, 0.95)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card com cantos chanfrados -->
  <polygon points="12,4 88,4 96,12 96,88 88,96 12,96 4,88 4,12" fill="url(#bgGrad)" stroke="#05ffa1" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Cantoneiras Cibernéticas (L-Brackets) -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <path d="M 92 16 L 92 8 L 84 8" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <path d="M 8 84 L 8 92 L 16 92" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <path d="M 92 84 L 92 92 L 84 92" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <!-- Conteúdo Principal do Ícone -->
  
  <!-- Bandeja de Sushi -->
  <rect x="20" y="34" width="60" height="42" rx="3" fill="#121e2c" stroke="#05ffa1" stroke-width="2.2"/>
  <!-- Peça 1 (Nigiri) -->
  <rect x="26" y="44" width="20" height="12" rx="4" fill="#ffffff" stroke="#05ffa1" stroke-width="1.5"/>
  <rect x="26" y="42" width="20" height="6" rx="2" fill="#ff003c"/>
  <!-- Peça 2 (Maki) -->
  <circle cx="62" cy="50" r="8" fill="#101c24" stroke="#05ffa1" stroke-width="1.8"/>
  <circle cx="62" cy="50" r="4" fill="#ff7700"/>
  <!-- Wasabi Verde -->
  <circle cx="64" cy="66" r="3" fill="#05ffa1"/>

</svg>