<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 30, 0.95)"/>
      <stop offset="100%" stop-color="rgba(18, 36, 56, 0.95)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card com cantos chanfrados -->
  <polygon points="12,4 88,4 96,12 96,88 88,96 12,96 4,88 4,12" fill="url(#bgGrad)" stroke="#22d8e2" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Cantoneiras Cibernéticas (L-Brackets) -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#22d8e2" stroke-width="2"/>
  <path d="M 92 16 L 92 8 L 84 8" fill="none" stroke="#22d8e2" stroke-width="2"/>
  <path d="M 8 84 L 8 92 L 16 92" fill="none" stroke="#22d8e2" stroke-width="2"/>
  <path d="M 92 84 L 92 92 L 84 92" fill="none" stroke="#22d8e2" stroke-width="2"/>
  <!-- Conteúdo Principal do Ícone -->
  
  <!-- Silhueta da Jaqueta -->
  <path d="M 36 24 L 20 38 L 26 74 L 38 72 L 38 78 L 62 78 L 62 72 L 74 74 L 80 38 L 64 24 Z" fill="#162436" stroke="#22d8e2" stroke-width="2.2"/>
  <!-- Gola Alta Samurai -->
  <path d="M 36 24 L 50 36 L 64 24" fill="none" stroke="#fcee0a" stroke-width="2.5"/>
  <!-- Zíper Frontal com Destaque -->
  <line x1="50" y1="36" x2="50" y2="78" stroke="#22d8e2" stroke-width="2"/>
  <!-- Faixas Neon nos Ombros/Mangas -->
  <line x1="23" y1="46" x2="34" y2="43" stroke="#fcee0a" stroke-width="2"/>
  <line x1="77" y1="46" x2="66" y2="43" stroke="#fcee0a" stroke-width="2"/>
  <!-- Insígnia no Peito -->
  <circle cx="43" cy="46" r="3" fill="#ff003c"/>

</svg>