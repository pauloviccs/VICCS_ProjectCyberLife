<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 30, 0.95)"/>
      <stop offset="100%" stop-color="rgba(18, 36, 56, 0.95)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card com cantos chanfrados -->
  <polygon points="12,4 88,4 96,12 96,88 88,96 12,96 4,88 4,12" fill="url(#bgGrad)" stroke="#fcee0a" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Cantoneiras Cibernéticas (L-Brackets) -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M 92 16 L 92 8 L 84 8" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M 8 84 L 8 92 L 16 92" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M 92 84 L 92 92 L 84 92" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <!-- Conteúdo Principal do Ícone -->
  
  <!-- Copa do Chapéu / Boné -->
  <path d="M 32 48 C 32 32, 68 32, 68 48 Z" fill="#182638" stroke="#fcee0a" stroke-width="2"/>
  <!-- Aba Curvada -->
  <path d="M 18 52 C 30 46, 70 46, 82 52 C 86 54, 78 60, 50 60 C 22 60, 14 54, 18 52 Z" fill="#122030" stroke="#fcee0a" stroke-width="2.2"/>
  <!-- Faixa de Detalhe com Logo -->
  <path d="M 32 46 Q 50 42 68 46" fill="none" stroke="#22d8e2" stroke-width="2"/>
  <circle cx="50" cy="40" r="3" fill="#ff003c"/>

</svg>