<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 30, 0.95)"/>
      <stop offset="100%" stop-color="rgba(18, 36, 56, 0.95)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card com cantos chanfrados -->
  <polygon points="12,4 88,4 96,12 96,88 88,96 12,96 4,88 4,12" fill="url(#bgGrad)" stroke="#fcee0a" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Cantoneiras Cibernéticas (L-Brackets) -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M 92 16 L 92 8 L 84 8" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M 8 84 L 8 92 L 16 92" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M 92 84 L 92 92 L 84 92" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <!-- Conteúdo Principal do Ícone -->
  
  <!-- Elo Principal da Corrente Pesada -->
  <path d="M 24 30 C 24 64, 76 64, 76 30" fill="none" stroke="#fcee0a" stroke-width="4.5" stroke-dasharray="6,3"/>
  <path d="M 28 30 C 28 58, 72 58, 72 30" fill="none" stroke="#ffd700" stroke-width="2"/>
  <!-- Pingente de Dólar / Emblema Heywood -->
  <circle cx="50" cy="64" r="10" fill="#182638" stroke="#fcee0a" stroke-width="2"/>
  <text x="50" y="69" text-anchor="middle" fill="#fcee0a" font-family="monospace" font-size="12" font-weight="bold">E$</text>

</svg>