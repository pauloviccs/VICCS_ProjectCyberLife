<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 30, 0.95)"/>
      <stop offset="100%" stop-color="rgba(18, 36, 56, 0.95)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card com cantos chanfrados -->
  <polygon points="12,4 88,4 96,12 96,88 88,96 12,96 4,88 4,12" fill="url(#bgGrad)" stroke="#05ffa1" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Cantoneiras Cibernéticas (L-Brackets) -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <path d="M 92 16 L 92 8 L 84 8" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <path d="M 8 84 L 8 92 L 16 92" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <path d="M 92 84 L 92 92 L 84 92" fill="none" stroke="#05ffa1" stroke-width="2"/>
  <!-- Conteúdo Principal do Ícone -->
  
  <!-- Shorts Esportivo / Streetwear -->
  <path d="M 32 28 L 68 28 L 67 56 L 54 56 L 50 40 L 46 56 L 33 56 Z" fill="#162638" stroke="#05ffa1" stroke-width="2.2"/>
  <!-- Faixa Elástica de Cintura -->
  <rect x="32" y="28" width="36" height="6" fill="#1a2e44" stroke="#05ffa1" stroke-width="1.8"/>
  <!-- Linhas Esportivas Neon Laterais -->
  <line x1="36" y1="36" x2="36" y2="54" stroke="#fcee0a" stroke-width="2"/>
  <line x1="64" y1="36" x2="64" y2="54" stroke="#fcee0a" stroke-width="2"/>

</svg>