<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 18, 30, 0.95)"/>
      <stop offset="100%" stop-color="rgba(18, 36, 56, 0.95)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card com cantos chanfrados -->
  <polygon points="12,4 88,4 96,12 96,88 88,96 12,96 4,88 4,12" fill="url(#bgGrad)" stroke="#ff003c" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Cantoneiras Cibernéticas (L-Brackets) -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#ff003c" stroke-width="2"/>
  <path d="M 92 16 L 92 8 L 84 8" fill="none" stroke="#ff003c" stroke-width="2"/>
  <path d="M 8 84 L 8 92 L 16 92" fill="none" stroke="#ff003c" stroke-width="2"/>
  <path d="M 92 84 L 92 92 L 84 92" fill="none" stroke="#ff003c" stroke-width="2"/>
  <!-- Conteúdo Principal do Ícone -->
  
  <!-- Braço Mecânico Reforçado -->
  <path d="M 28 30 L 48 30 L 58 48 L 52 74 L 38 74 L 42 50 Z" fill="#142232" stroke="#ff003c" stroke-width="2.2"/>
  <!-- Articulação de Ombro com Pistão -->
  <circle cx="36" cy="30" r="8" fill="#1c2c3e" stroke="#fcee0a" stroke-width="2"/>
  <!-- Lâmina Retrátil Mantis / Pistão Hidráulico -->
  <line x1="52" y1="46" x2="78" y2="24" stroke="#00e5ff" stroke-width="2.5"/>
  <line x1="56" y1="52" x2="82" y2="30" stroke="#00e5ff" stroke-width="1.8"/>
  <circle cx="56" cy="48" r="4" fill="#fcee0a"/>

</svg>